<!-- Admin Sidebar -->
<aside class="fixed inset-y-0 left-0 w-64 bg-brand-800 flex flex-col z-30">
  <!-- Logo -->
  <div class="flex items-center gap-3 px-6 py-5 border-b border-brand-700">
    <div class="w-9 h-9 bg-white rounded-lg flex items-center justify-center">
      <svg class="w-5 h-5 text-brand-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h18M3 12h18M3 17h18" />
      </svg>
    </div>
    <div>
      <div class="text-white font-bold text-base leading-tight">KantorKu</div>
      <div class="text-brand-300 text-xs">Sistem Pengelolaan Barang</div>
    </div>
  </div>

  <!-- User info -->
  <div class="px-4 py-4 border-b border-brand-700">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-brand-600 flex items-center justify-center text-white font-bold text-sm">
        {{if .user}}{{slice .user.FullName 0 1}}{{else}}A{{end}}
      </div>
      <div class="min-w-0">
        <div class="text-white text-sm font-semibold truncate">{{if .user}}{{.user.FullName}}{{end}}</div>
        <div class="flex gap-1 mt-0.5 flex-wrap">
          {{if .claims}}
            {{range .claims.Roles}}
            <span class="text-xs bg-brand-600 text-brand-200 px-1.5 py-0.5 rounded font-medium">
              {{roleLabel .}}
            </span>
            {{end}}
          {{end}}
        </div>
      </div>
    </div>
  </div>

  <!-- Nav -->
  <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
    <p class="text-brand-400 text-xs font-semibold uppercase tracking-wider px-4 mb-2">Menu Utama</p>
    <a href="/admin/dashboard" class="sidebar-link {{if eq .activePage "dashboard"}}active{{end}}">
      <svg class="w-4.5 h-4.5 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      Dashboard
    </a>
    <a href="/admin/users" class="sidebar-link {{if eq .activePage "users"}}active{{end}}">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      Kelola Pengguna
    </a>
  </nav>

  <!-- Logout -->
  <div class="px-3 py-4 border-t border-brand-700">
    <form action="/logout" method="POST">
      <button type="submit" class="sidebar-link w-full text-left hover:bg-red-600/20 hover:text-red-300">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Keluar
      </button>
    </form>
  </div>
</aside>
